# Runtime backend configuration. Launcher state is stored under ./db.
cdn_source = NC_SOFT_JAPANESE
patch_version = 101
include_file_filter = *
exclude_file_filter = */*.dlt;*.torrent
check_hash_sum = true
check_file_size = true
download_mode = HYBRID
restore_downloading = true
check_files_by_name = true
check_files_by_size = true
thread_usage = true
parallel_downloading = 3
parallel_decoding = 5
parallel_storing = 1
thread_on_parallel_file_check = 5
logging_progress_of_file_check = true
acmi_like_logging = false
